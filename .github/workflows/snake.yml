name: snake

on:
  schedule:
    - cron: '41 3 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: usestrak
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#14F195&color_dots=#161320,#3a2570,#6E3BE8,#9945FF,#C9A6FF
            dist/snake-light.svg?palette=github-light&color_snake=#6E3BE8&color_dots=#ece7f8,#c9b6ff,#9945FF,#6E3BE8,#3a1f8f

      - name: publish
        run: |
          cd dist
          git init -q -b output
          git config user.name "Strak"
          git config user.email "180978138+usestrak@users.noreply.github.com"
          git add -A
          git commit -q -m "Contribution snake, $(date -u +'%Y-%m-%d')"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
